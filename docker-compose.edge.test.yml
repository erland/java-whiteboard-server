services:
  edge-nginx:
    image: nginx:1.27-alpine
    container_name: whiteboard-edge-nginx
    ports:
      - "80:80"
    volumes:
      - ./deploy/test/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/test/pwa-whiteboard/config.json:/etc/nginx/pwa-whiteboard/config.json:ro
    depends_on:
      server:
        condition: service_started
      keycloak:
        condition: service_started
      pwa:
        condition: service_started

  # ----- PWA -----
  pwa:
    image: ghcr.io/erland/pwa-whiteboard:latest
    container_name: pwa-whiteboard
    restart: unless-stopped

  # ----- API server -----
  server:
    image: ghcr.io/erland/java-whiteboard-server:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: whiteboard-server
    environment:
      QUARKUS_PROFILE: prod

      QUARKUS_DATASOURCE_DB_KIND: postgresql
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/whiteboard
      QUARKUS_DATASOURCE_USERNAME: whiteboard
      QUARKUS_DATASOURCE_PASSWORD: whiteboard

      QUARKUS_OIDC_AUTH_SERVER_URL: http://edge-nginx/auth/realms/whiteboard
      QUARKUS_OIDC_DISCOVERY_ENABLED: "false"
      QUARKUS_OIDC_JWKS_PATH: http://edge-nginx/auth/realms/whiteboard/protocol/openid-connect/certs
      QUARKUS_OIDC_TOKEN_ISSUER: http://localhost/auth/realms/whiteboard
      QUARKUS_OIDC_CLIENT_ID: whiteboard-server
      QUARKUS_OIDC_APPLICATION_TYPE: service
      QUARKUS_OIDC_TLS_VERIFICATION: none

      # behind reverse proxy
      QUARKUS_HTTP_PROXY_PROXY_ADDRESS_FORWARDING: "true"

    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
    restart: unless-stopped

  # ----- Postgres (API) -----
  postgres:
    image: postgres:16
    container_name: whiteboard-server-postgres
    environment:
      POSTGRES_DB: whiteboard
      POSTGRES_USER: whiteboard
      POSTGRES_PASSWORD: whiteboard
    volumes:
      - whiteboard_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 5s
    restart: unless-stopped

  # ----- Keycloak -----
  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: whiteboard-server-keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_RELATIVE_PATH: /auth
      KC_PROXY: edge
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME: localhost
      KC_PROXY_HEADERS: xforwarded
    volumes:
      - ./deploy/test/keycloak/realm-whiteboard.json:/opt/keycloak/data/import/realm-whiteboard.json:ro
    healthcheck:
      test: ["CMD-SHELL", "sh -lc '(command -v curl >/dev/null && curl -fsS http://localhost:8080/auth/realms/whiteboard/.well-known/openid-configuration) || (command -v wget >/dev/null && wget -qO- http://localhost:8080/auth/realms/whiteboard/.well-known/openid-configuration >/dev/null)'"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 20s
    restart: unless-stopped

volumes:
  whiteboard_pgdata:
