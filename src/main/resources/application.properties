quarkus.application.name=java-whiteboard-server
quarkus.http.port=8080

# Enable basic health endpoints:
# - /q/health/live
# - /q/health/ready

# --- Local dev defaults (override with environment variables in docker-compose) ---
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${QUARKUS_DATASOURCE_JDBC_URL:jdbc:postgresql://localhost:5432/whiteboard}
quarkus.datasource.username=${QUARKUS_DATASOURCE_USERNAME:whiteboard}
quarkus.datasource.password=${QUARKUS_DATASOURCE_PASSWORD:whiteboard}

# OIDC issuer (Keycloak). Step 4 will enforce auth on selected endpoints.
quarkus.oidc.auth-server-url=${QUARKUS_OIDC_AUTH_SERVER_URL:http://localhost:18080/realms/whiteboard}
quarkus.oidc.client-id=${QUARKUS_OIDC_CLIENT_ID:whiteboard-server}
quarkus.oidc.application-type=service
quarkus.oidc.tls.verification=none

# --- Test profile: keep unit/integration tests local-only (no Docker, no Keycloak required) ---
%test.quarkus.oidc.enabled=false
%test.quarkus.datasource.devservices.enabled=false

# --- Flyway ---
# Run migrations automatically on startup (dev/prod).
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true

# Tests should not require a running database at this stage.
%test.quarkus.flyway.migrate-at-start=false


# --- Hardening defaults ---
whiteboard.limits.ws.max-message-bytes=65536
whiteboard.limits.ws.rate.per-second=20
whiteboard.limits.ws.rate.burst=40
whiteboard.limits.ws.max-connections-per-board=64

# Snapshot payload hard limit (UTF-8 bytes)
whiteboard.limits.snapshots.max-bytes=1048576

# Health endpoints: /q/health (liveness/readiness)
quarkus.smallrye-health.root-path=/q/health

# Metrics endpoint: /q/metrics (Prometheus)
quarkus.micrometer.export.prometheus.enabled=true
quarkus.micrometer.export.prometheus.path=/q/metrics



# --- Step 10.1: WebSocket JWT verification (SmallRye JWT) ---
# We validate Bearer tokens presented in the WebSocket handshake using MP-JWT verification.
# This uses Keycloak's JWKS endpoint (derived from quarkus.oidc.auth-server-url).
%dev.mp.jwt.verify.publickey.location=${quarkus.oidc.auth-server-url}/protocol/openid-connect/certs
%dev.mp.jwt.verify.issuer=${quarkus.oidc.auth-server-url}

# In prod you should set these explicitly to your realm issuer + JWKS url.
# mp.jwt.verify.publickey.location=
# mp.jwt.verify.issuer=
