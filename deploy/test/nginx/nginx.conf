worker_processes  1;

events { worker_connections  1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  sendfile        on;
  keepalive_timeout  65;

  server {
    listen 80;

    # --- Runtime config for PWA ---
    location = /pwa-whiteboard/config.json {
      default_type application/json;
      add_header Cache-Control "no-store";
      alias /etc/nginx/pwa-whiteboard/config.json;
    }

    # --- PWA (container) ---
    location = /pwa-whiteboard {
      return 302 /pwa-whiteboard/;
    }
    location /pwa-whiteboard/ {
      proxy_pass http://pwa-whiteboard:80/pwa-whiteboard/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Server REST ---
    location /api/ {
      proxy_pass http://server:8080/api/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Server WebSocket ---
    location /ws/ {
      proxy_pass http://server:8080/ws/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_read_timeout 3600s;
    }

    # --- Keycloak ---
    location /auth/ {
      proxy_pass http://keycloak:8080/auth/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
