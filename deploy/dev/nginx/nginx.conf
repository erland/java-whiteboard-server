worker_processes  1;

events { worker_connections  1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # If the client passes an access token as a query parameter (common for browser WebSockets),
  # forward it as an Authorization header to the upstream so Quarkus OIDC can authenticate it.
  # Example WS URL: ws://<host>/ws/boards/<id>?access_token=<jwt>
  map $arg_access_token $ws_auth_header {
    default "Bearer $arg_access_token";
    ""      "";
  }

  sendfile        on;
  keepalive_timeout  65;

  server {
    listen 80;

    # --- Runtime config for PWA ---
    location = /pwa-whiteboard/config.json {
      default_type application/json;
      add_header Cache-Control "no-store";
      alias /etc/nginx/pwa-whiteboard/config.json;
    }

    # --- PWA (dev server on host) ---
    # Expect Vite dev server to be started on the host on port 5173.
    # Ensure the trailing slash so relative asset paths behave consistently.
    location = /pwa-whiteboard {
      return 301 /pwa-whiteboard/;
    }

    location /pwa-whiteboard/ {
      # IMPORTANT: Do NOT strip the /pwa-whiteboard/ prefix.
      # The Vite dev server is configured to serve under that base path,
      # and stripping it can cause redirect loops.
      proxy_pass http://host.docker.internal:5173;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # Vite HMR uses WebSockets.
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }

    # --- Server REST ---
    location /api/ {
      proxy_pass http://host.docker.internal:8080/api/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Server WebSocket ---
    location /ws/ {
      proxy_pass http://host.docker.internal:8080/ws/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # Forward query-string token as a standard Bearer token header.
      proxy_set_header Authorization $ws_auth_header;
      proxy_read_timeout 3600s;
    }

    # --- Keycloak (bundled) ---
    location /auth/ {
      proxy_pass http://keycloak:8080/auth/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
